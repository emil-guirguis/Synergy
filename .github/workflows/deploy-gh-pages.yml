name: Deploy site to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: MeterItPro/frontend/package-lock.json

      - name: Install Chrome for puppeteer (prerender)
        run: npx puppeteer browsers install chrome
        working-directory: ./MeterItPro/frontend
        continue-on-error: true

      - name: Install dependencies (framework/frontend)
        # MeterItPro/frontend and TBWC/frontend both pull framework/frontend in
        # via a bare `file:` dependency (no npm workspaces), so their own `npm
        # ci` below never installs framework/frontend's OWN deps (mui, xlsx,
        # jspdf, apexcharts, ...) — only works locally because that directory's
        # node_modules already exists from some earlier manual install. Without
        # this, Rollup fails to resolve "xlsx" from exportHelpers.ts.
        run: npm ci
        working-directory: ./framework/frontend

      - name: Install dependencies (frontend)
        run: npm ci
        working-directory: ./MeterItPro/frontend

      - name: Build frontend
        run: npm run build
        working-directory: ./MeterItPro/frontend
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # Monotonic build number for the version shown in the user menu —
          # version.json is committed to Synergy, but this workflow never writes
          # its bump back, so every checkout starts from the same stale value
          # and the file-based counter would repeat instead of advancing.
          VERSION_BUILD_OVERRIDE: ${{ github.run_number }}

      # --- TBWC portal: built into the SAME Pages artifact under /TBWCPortal/ ---
      - name: Install dependencies (TBWC portal)
        run: npm ci
        working-directory: ./TBWC/frontend

      - name: Build TBWC portal
        run: npm run build
        working-directory: ./TBWC/frontend
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/TBWCPortal/
          VERSION_BUILD_OVERRIDE: ${{ github.run_number }}

      - name: Merge TBWC portal into site artifact
        run: |
          rm -rf MeterItPro/frontend/dist/TBWCPortal
          mkdir -p MeterItPro/frontend/dist/TBWCPortal
          cp -r TBWC/frontend/dist/. MeterItPro/frontend/dist/TBWCPortal/

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: MeterItPro/frontend/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Smoke test GitHub Pages
        if: always()
        run: |
          owner=${GITHUB_REPOSITORY%%/*}
          repo=${GITHUB_REPOSITORY##*/}
          url="https://${owner}.github.io/${repo}/"
          tbwc_url="https://${owner}.github.io/${repo}/TBWCPortal/"

          echo "Checking Pages URL: $url"

          success=0
          for i in {1..36}; do
            echo "Attempt $i: curling $url"
            if curl -fsSL --max-time 10 "$url" -o /dev/null; then
              echo "Site responded successfully"
              success=1
              break
            fi
            sleep 10
          done

          if [ "$success" -ne 1 ]; then
            echo "ERROR: GitHub Pages site did not become available at $url within the timeout"
            exit 1
          fi

          echo "Checking TBWC portal URL: $tbwc_url"
          if curl -fsSL --max-time 10 "$tbwc_url" -o /dev/null; then
            echo "TBWC portal responded successfully"
          else
            echo "ERROR: TBWC portal did not respond at $tbwc_url"
            exit 1
          fi
