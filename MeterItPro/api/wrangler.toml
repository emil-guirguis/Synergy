name = "meteritpro-api"
main = "worker/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
routes = [
  { pattern = "meteritpro.com/api/*", zone_name = "meteritpro.com" },
  { pattern = "www.meteritpro.com/api/*", zone_name = "meteritpro.com" }
]

[vars]
NODE_ENV = "production"
FRONTEND_URL = "https://meteritpro.com,http://localhost:5173,http://localhost:3003,https://www.meteritpro.com,http://localhost:8080"

# Secrets (set via `npx wrangler secret put`):
# npx wrangler secret put DATABASE_URL
# npx wrangler secret put JWT_SECRET
# npx wrangler secret put RESEND_API_KEY      — from resend.com (free tier, required for reports)
# npx wrangler secret put RESEND_FROM         — e.g. "MeterItPro <noreply@meteritpro.com>"
# npx wrangler secret put ANTHROPIC_API_KEY    — from console.anthropic.com (paid, required for AI chat)

[triggers]
crons = ["*/15 * * * *"]   # Run every 15 min: fire when rule cron matches, always clear stale notifications

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "48644504510e40829be6f314dacc1ef3"
localConnectionString = "postgresql://postgres.uueumbslimaecposqsdf:ZfyUDh!_x4bSYXm@aws-1-us-west-1.pooler.supabase.com:6543/postgres"

[observability]
[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = false
