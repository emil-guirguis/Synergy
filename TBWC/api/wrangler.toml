name = "tbwc-api"
main = "worker/index.ts"
compatibility_date = "2025-05-05"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8788

[vars]
FRONTEND_URL = "http://localhost:5174,http://localhost:5173"
# Local dev: direct non-SSL connection to the Supabase pooler (workerd can't do
# Postgres TLS locally, and the pooler accepts plaintext). A deployed Worker
# should drop this and use the Hyperdrive binding below (edge-managed TLS).
DATABASE_URL = "postgresql://postgres.detwkqhqekaiyuajixhs:%23cxQEPx3%2B%40dL%3F2u@aws-0-ca-central-1.pooler.supabase.com:6543/postgres"
SUPABASE_URL = "https://detwkqhqekaiyuajixhs.supabase.co"
# Public anon key (same one the browser uses). Not a secret.
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRldHdrcWhxZWthaXl1YWppeGhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4MTI4ODIsImV4cCI6MjEwMDM4ODg4Mn0.OUE2KsTclMTqbPZ97_MXXVG4Nqq1ZOIIujdVJWCEx88"
# Base URL of the TBWC portal (dev = local vite server) — used to build the
# 90-day re-verification link mailed to locked-out reps. See reverification.ts.
PORTAL_URL = "http://localhost:5174/"
# Service role key for the cron to call the send-mail edge fn (no browser
# session to borrow a token from). Set as a secret, do NOT put here:
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
# Unset locally => sendMail throws and lockStaleReps just logs it (see
# mail.ts/reverification.ts); harmless since `wrangler dev` doesn't fire
# scheduled events unless run with --test-scheduler.

# Groq API key for /api/ai/chat — set as a secret before deploy, do NOT put here:
#   wrangler secret put GROQ_API_KEY
# Unset => the route returns 503 instead of calling out.

# QBWC SOAP credentials — set as secrets before deploy, do NOT put here:
#   wrangler secret put QBWC_USERNAME
#   wrangler secret put QBWC_PASSWORD
# Unset locally => dev fallback (tbwc/changeme) in worker/routes/qbwc.ts.
#
# QBWC_COMPANY_FILE (below, per-env var) = absolute .qbw path on the QB machine.
# Set => unattended: QBWC launches QuickBooks and opens that file itself.
# Unset => attended: the connector uses whatever file is already open, and a run
# with QuickBooks closed fails with "Could not start QuickBooks".

# Hyperdrive → tbwc-site Supabase Postgres. For `wrangler dev`, localConnectionString
# is used directly; `id` matters only for a deployed Worker (replace before deploy).
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "00000000000000000000000000000000"
localConnectionString = "postgresql://postgres.detwkqhqekaiyuajixhs:%23cxQEPx3%2B%40dL%3F2u@aws-0-ca-central-1.pooler.supabase.com:5432/postgres"

[observability]
[observability.logs]
enabled = true

# Daily re-verification sweep (worker/index.ts scheduled handler -> lockStaleReps).
# `wrangler dev` doesn't fire this without --test-scheduler; must be duplicated
# under [env.production.triggers] below since named envs don't inherit this.
[triggers]
crons = ["0 13 * * *"]

# --- production -------------------------------------------------------------
# Deploy with:  wrangler deploy --env production
# Named envs do NOT inherit top-level [vars]/bindings, so prod is fully defined
# here. Note: NO DATABASE_URL — query() falls back to the Hyperdrive binding,
# which manages its own TLS (the plaintext pooler URL above is dev-only).
# Secrets are per-env:  wrangler secret put QBWC_USERNAME --env production
[env.production.vars]
# CORS origin = the GitHub Pages SITE origin (path doesn't matter for CORS).
# TBWC portal is served under this origin at /<repo>/TBWCPortal/.
FRONTEND_URL = "https://emil-guirguis.github.io"
# Unattended sync: the .qbw path as the QB machine sees it (TOML literal string,
# so backslashes need no escaping). DISABLED 2026-09-04: sending the Q:\ mapped-
# drive path made BeginSession fail with QBWC1013 0x80040408 "Could not start
# QuickBooks" even with QB open (path didn't match what QB had open). Unset =
# attended mode: the connector uses whatever company file is already open. To
# re-enable unattended, put back the path QB itself reports (F2 / Product
# Information window), preferably the UNC form (\\server\share\...), and re-grant
# "allow this application to log in automatically" in QB Integrated Applications.
#QBWC_COMPANY_FILE = 'Q:\Alll Quickbooks files\tbwc, inc..qbw'
SUPABASE_URL = "https://detwkqhqekaiyuajixhs.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRldHdrcWhxZWthaXl1YWppeGhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4MTI4ODIsImV4cCI6MjEwMDM4ODg4Mn0.OUE2KsTclMTqbPZ97_MXXVG4Nqq1ZOIIujdVJWCEx88"
# Full portal URL incl. subpath (see [vars] comment above for what this is for).
PORTAL_URL = "https://emil-guirguis.github.io/Synergy/TBWCPortal/"

[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "74980b729f904abe855ed1b48b7f304d"

[env.production.observability.logs]
enabled = true

# Named envs don't inherit [triggers] either — duplicate of the block above.
[env.production.triggers]
crons = ["0 13 * * *"]
